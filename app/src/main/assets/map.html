<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="leaflet.css">
<style>html,body,#m{height:100%;margin:0;background:#e5e3df}
#info{position:absolute;z-index:1000;left:8px;bottom:8px;background:rgba(255,255,255,.92);padding:4px 8px;border-radius:8px;font:12px sans-serif;color:#222}
#err{position:absolute;z-index:1000;left:8px;top:8px;right:8px;background:#fff3cd;padding:6px 8px;border-radius:8px;font:12px sans-serif;color:#664d03;display:none}</style>
</head><body><div id="m"></div><div id="info">En attente d'une position…</div><div id="err"></div>
<script src="leaflet.js"></script>
<script>
function showErr(t){var e=document.getElementById('err');e.style.display='block';e.textContent=t;}
window.onerror=function(m){showErr('Carte : '+m);};
var map,line,dot=null,circ=null,first=true,tileErrors=0,tilesOk=0;
try{
  map=L.map('m').setView([46.6,2.4],5);
  var tiles=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'OpenStreetMap, CARTO'}).addTo(map);
  tiles.on('tileload',function(){tilesOk++;document.getElementById('err').style.display='none';});
  tiles.on('tileerror',function(){tileErrors++;if(tilesOk===0&&tileErrors>3)showErr("Le fond de carte ne se charge pas (internet ?). Le point reste valable.");});
  line=L.polyline([],{color:'#0a3cff',weight:4,opacity:0.7}).addTo(map);
  setTimeout(function(){map.invalidateSize();},300);
  window.addEventListener('resize',function(){map.invalidateSize();});
}catch(e){showErr('Carte indisponible : '+e);}
function setTrack(a,follow){
  if(!map||!a.length)return;
  line.setLatLngs(a.map(function(p){return [p[0],p[1]];}));
  var l=a[a.length-1],ll=[l[0],l[1]],r=l[2]||20;
  document.getElementById('info').textContent=l[0].toFixed(5)+', '+l[1].toFixed(5)+' (±'+Math.round(r)+' m)';
  if(!dot){
    dot=L.circleMarker(ll,{radius:9,color:'#ffffff',weight:3,fillColor:'#e11d2e',fillOpacity:1}).addTo(map);
    circ=L.circle(ll,{radius:r,color:'#0a3cff',weight:1,fillColor:'#0a3cff',fillOpacity:0.12}).addTo(map);
  }else{dot.setLatLng(ll);circ.setLatLng(ll);circ.setRadius(r);}
  if(first){map.invalidateSize();map.setView(ll,17);first=false;}
  else if(follow){map.panTo(ll);}
}
</script></body></html>
