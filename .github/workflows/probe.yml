name: Sonde
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Sonder les modèles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
          for r in estebanuri/face_recognition shubham0204/FaceRecognition_With_FaceNet_Android MCarlomagno/FaceRecognitionAuth syaringan357/Android-MobileFaceNet-MNN sirius-ai/MobileFaceNet_TF zhangzhen119/FaceRecognition; do
            echo "-- $r"
            gh api "repos/$r/git/trees/HEAD?recursive=1" --jq '.tree[] | select(.path|test("tflite|onnx|\\.pb$|\\.mnn$";"i")) | "\(.size) \(.path)"' 2>&1 | head -15
          done
          echo "== sherpa-onnx modèles de voix"
          gh api repos/k2-fsa/sherpa-onnx/releases/tags/speaker-recongition-models --jq '.assets[] | "\(.size) \(.name)"' 2>&1 | head -60
          echo "== sherpa-onnx dernière version"
          gh api repos/k2-fsa/sherpa-onnx/releases/latest --jq '.tag_name' 2>&1
          gh api repos/k2-fsa/sherpa-onnx/releases/latest --jq '.assets[] | select(.name|test("android|aar";"i")) | "\(.size) \(.name)"' 2>&1 | head -20
          } > probe.txt 2>&1
          gh release delete probe --yes --cleanup-tag || true
          gh release create probe --prerelease --title "Sonde" --notes-file probe.txt
          gh release upload probe probe.txt --clobber
