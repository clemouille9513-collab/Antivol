name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Modèles de reconnaissance (visage, voix)
        run: |
          set -o pipefail
          bash scripts/telecharger-modeles.sh 2>&1 | tee modeles.log
      - name: Compiler
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: Antivol-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-dernier --yes --cleanup-tag || true
          gh release create apk-dernier app/build/outputs/apk/debug/app-debug.apk --title "Antivol APK" --notes "APK de test" --latest
      - name: Rapport d'erreur
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "== modèles"; tail -c 6000 modeles.log 2>/dev/null
            echo; echo "== compilation"
            grep -E "^e: |error:|What went wrong" -A3 build.log 2>/dev/null | head -c 50000
          } > err.txt || true
          [ -s err.txt ] || echo "Échec sans détail" > err.txt
          gh release delete erreur-build --yes --cleanup-tag || true
          gh release create erreur-build --prerelease --title "Erreur de compilation" --notes-file err.txt
