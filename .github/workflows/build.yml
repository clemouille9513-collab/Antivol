name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compiler
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: Antivol-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-dernier --yes --cleanup-tag || true
          gh release create apk-dernier app/build/outputs/apk/debug/app-debug.apk --title "Antivol APK" --notes "APK de test" --latest
      - name: Rapport d'erreur
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -c 60000 > err.txt || true
          [ -s err.txt ] || tail -c 20000 build.log > err.txt
          gh release delete erreur-build --yes --cleanup-tag || true
          gh release create erreur-build --prerelease --title "Erreur de compilation" --notes-file err.txt
